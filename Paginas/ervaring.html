  <main>
    <h1>Hier zie je de werkervaring die ik heb opgedaan</h1>
    <div class="about-cards-container">
      <about-card
        title="Boni Supermarkt BV"
        colors="#3dfffc,#7bff3d"
        gradienttype="radial">
      </about-card>

      <about-card
        title="Vakkenvuller - Caissière <br>
              2018-2021"
        text="Als 16-jarige ben ik bij de Boni in Loosdrecht begonnen als vakkenvuller.
        <br><br>
        Dit was de eerste keer dat ik een bijbaan had. In deze tijd heb ik geleerd hoe je met klanten, collega's en vaste verwachtingen omgaat.
        <br><br>
        Na een poosje werden er steeds meer taken aan mij toevertrouwd zoals kassa en helpen op de broodafdeling.
        "
        image="/images/ervaring/oudeboni.jpg"
        colors="#e30613,#ffd500">
      </about-card>

      <about-card
        title="Verkoopmedewerker - Leidinggevende<br>
              Vanaf 2022"
        text="Na een paar jaar kwam er in het ondertussen nieuw gebouwde pand een opening als leidinggevende vrij en werd mij deze rol aangeboden. Deze kans heb ik toen uiteraard genomen.
        <br><br>
        Ik leerde niet alleen hoe ik de voorraden moest bijhouden en bestellen, maar ook hoe ik met grote geldbedragen omga, zoals het tellen van kassalades en het doen van bankstortingen. 
        <br>
        Alles wat nodig is om een winkel draaiende te houden. In deze periode haalde ik ook mijn SVH-certificaat voor de slijterij en heb ik mijn BHV-certificaat behaald.
        <br><br>
        ’s Avonds en op Zaterdagen heb ik vaak zelfstandig de leiding over de winkel."
        image="/images/ervaring/rubenboni.jpg"
        colors="#004c99,#a6000c">
      </about-card>

      <about-card
        title="SureShot"
        colors="#3dfffc,#7bff3d"
        gradienttype="radial">
      </about-card>

      <about-card
        title="Website Developer"
        text="In het tweedejaar van mijn studie HBO-ICT moesten wij in een groep een web development gerelateerde opdracht uitvoeren voor een bedrijf.<br>Via 
        <a href='https://www.bickery.nl' target='_blank'>Bickery</a>
        kwamen wij toen uit bij
        <a href='https://sure-shot.eu' target='_blank'>SureShot</a>.
        <br><br>
        Voor SureShot hebben wij een nieuwe website gebouwd met een eigen CMS, waarbij wij zowel de Front-End als Back-End hebben ontwikkeld. Daarnaast hebben wij ook het hostingproces voor hun geregeld."
        image="/images/ervaring/sureshothomepage.png"
        colors="#66A3FF,#0057FF">
      </about-card>

      <about-card
        title="Irias"
        colors="#3dfffc,#7bff3d"
        gradienttype="radial">
      </about-card>

      <about-card
        title="Speurtochtmodule"
        text="Aan het begin van mijn derde jaar heb ik samen met studie genoten gewerkt voor Irias aan een Speurtochtmodule voor hun <br>
        <a href='https://www.irias.nl/portfolio/routemaker/' target='_blank'>Routemaker</a> app. <br>
        Dit diende als een uitbreiding op de bestaande app en maakte het mogelijk voor gebruikers om speurtochten te maken en lopen."
        image="/images/ervaring/iriasspeurtochtmodule.png"
        colors="#A255B8,#FFFFFF">
      </about-card>

      <about-card
        title="Stichting Brandweeropleidingen BOGO"
        colors="#3dfffc,#7bff3d"
        gradienttype="radial">
      </about-card>

      <about-card
        title="Brandweer Simulatie Applicatie"
        text="Aan het eind van mijn derde jaar heb ik gewerkt aan een simulatie applicatie voor BOGO.<br><br>
        BOGO had een simulatie applicatie nodig waarin zij scenarios konden maken om voor te leggen aan hun studenten tijdens de trainingen.<br><br>
        Samen met andere studenten heb ik een simulatie gemaakt waarin zij hun eigen fotos konden uploaden, gebouwen uit konden snijden en vervolgens verschillende soorten vuur en rook toevoegen."
        image="/images/ervaring/bogovuursimulatie.jpeg"
        colors="#E03C32,#FFFFFF">
      </about-card>

      <about-card
        title="School Projecten"
        colors="#3dfffc,#7bff3d"
        gradienttype="radial">
      </about-card>

      <about-card
        title="Wijkagent Applicatie - 2de jaar Windesheim"
        text="Aan het eind van de eerste periode hebben wij een wijkagent applicatie gemaakt. 
        <br><br>Hierin werd het mogelijk gemaakt voor wijkagenten om misdaadmeldingen in te voeren voor hun wijk, waarbij de wijken gebieden waren gebaseerd op coördinaten. 
        <br><br> Deze meldingen waren dan te zien voor de wijkagenten op een interactieve kaart."
        image="/images/ervaring/wijkagentvoorbeeld.jpg"
        colors="#66A3FF,#0057FF">
      </about-card>

    </div>
